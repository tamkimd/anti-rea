<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anti-REA hardening workflow</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f9fa; color: #172832; }
    main { width: min(100%, 1680px); margin: 0 auto; padding: 52px 40px 36px; }
    .eyebrow { margin: 0 0 14px; color: #456779; font-size: 14px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 42px; line-height: 1.12; letter-spacing: -.035em; font-weight: 650; }
    .intro { margin: 12px 0 26px; color: #526672; font-size: 17px; line-height: 1.5; }
    .canvas { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1180px; height: auto; }
    .baseline { fill: #edf3f6; stroke: #7692a0; stroke-width: 2; }
    .node { fill: #fff; stroke: #9aabb3; stroke-width: 1.6; }
    .node.approval { fill: #eff5f7; stroke: #456779; stroke-width: 2; }
    .decision { fill: #fff; stroke: #456779; stroke-width: 2; }
    .accept { fill: #e7f5f1; stroke: #087f68; stroke-width: 2; }
    .revise { fill: #fff1ed; stroke: #bf4520; stroke-width: 2; }
    .flow { fill: none; stroke: #456779; stroke-width: 2.5; marker-end: url(#arrow); }
    .loop { fill: none; stroke: #bf4520; stroke-width: 2.5; marker-end: url(#arrow-coral); }
    .compare { fill: none; stroke: #7692a0; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow-muted); }
    .step { fill: #526672; font-size: 12px; font-weight: 750; letter-spacing: .12em; }
    .title { fill: #172832; font-size: 20px; font-weight: 700; }
    .body { fill: #526672; font-size: 15px; }
    .label { fill: #456779; font-size: 13px; font-weight: 700; letter-spacing: .07em; }
    .label-coral { fill: #a13a1e; font-size: 13px; font-weight: 700; }
    .label-green { fill: #087f68; font-size: 13px; font-weight: 750; }
    .caption { fill: #526672; font-size: 14px; }
    footer { display: flex; justify-content: space-between; gap: 24px; margin-top: 10px; color: #526672; font-size: 14px; }
    footer strong { color: #172832; font-weight: 650; }
    @media (max-width: 700px) { main { padding: 32px 20px 24px; } h1 { font-size: 32px; } .intro { font-size: 15px; } footer { display: block; } footer span { display: block; margin-top: 8px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Anti-REA · Evidence-led hardening</p>
    <h1>Anti-REA hardening workflow</h1>
    <p class="intro">Analyze one fixed baseline, approve a concrete plan, harden once, then accept or revise from measured AFTER evidence.</p>
    <div class="canvas">
      <svg viewBox="0 0 1600 1020" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="anti-rea-workflow-title anti-rea-workflow-desc">
        <title id="anti-rea-workflow-title">Anti-REA hardening workflow</title>
        <desc id="anti-rea-workflow-desc">Capture one immutable BEFORE baseline, run REA and Craft Anything analysis in parallel, plan supported hardening actions, wait for approval, harden one isolated candidate, run AFTER analysis and required build, behavior, and integrity checks against the same baseline, then accept or report rejection or partial evidence. A retry requires a new plan and approval.</desc>
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#456779"/></marker>
          <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#bf4520"/></marker>
          <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#087f68"/></marker>
          <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7692a0"/></marker>
        </defs>

        <text class="title" x="64" y="48" style="font-size:32px;letter-spacing:-.03em">One baseline. Analyze, improve, measure.</text>
        <text class="body" x="64" y="78">Parallel evidence informs one approved hardening pass and a comparable AFTER result.</text>
        <g transform="translate(0 60)">
        <rect class="baseline" x="64" y="92" width="1472" height="96" rx="12"/>
        <text class="step" x="96" y="126">01 · CAPTURE BEFORE ONCE</text>
        <text class="title" x="96" y="161">Fixed release baseline</text>
        <text class="body" x="435" y="161">Artifact identity · hashes · configured behavior</text>
        <text class="label" x="1288" y="148">UNCHANGED REFERENCE</text>

        <path class="flow" d="M800 188V218H430V244"/>
        <path class="flow" d="M800 218H1170V244"/>
        <rect class="node" x="270" y="244" width="320" height="88" rx="10"/>
        <text class="step" x="294" y="273">02A · ANALYZE BEFORE</text>
        <text class="title" x="294" y="306">REA</text>
        <text class="body" x="378" y="306">Version · coverage · findings</text>
        <rect class="node" x="1010" y="244" width="320" height="88" rx="10"/>
        <text class="step" x="1034" y="273">02B · ANALYZE BEFORE</text>
        <text class="title" x="1034" y="306">Craft Anything</text>
        <text class="body" x="1195" y="306">Evidence · findings</text>

        <path class="flow" d="M430 332V362H800V384"/>
        <path class="flow" d="M1170 332V362H800V384"/>
        <rect class="node" x="626" y="384" width="348" height="104" rx="10"/>
        <text class="step" x="652" y="414">03 · PLAN IMPROVEMENT</text>
        <text class="title" x="652" y="446" style="font-size:18px">Map findings to supported actions</text>
        <text class="body" x="652" y="472">Benefit · trade-offs · checks · rollback</text>

        <path class="flow" d="M800 488V512"/>
        <rect class="node approval" x="626" y="512" width="348" height="76" rx="10"/>
        <text class="step" x="652" y="540">04 · USER APPROVAL</text>
        <text class="title" x="652" y="570">Approve exact plan hash</text>

        <path class="flow" d="M800 588V612"/>
        <rect class="node" x="626" y="612" width="348" height="88" rx="10"/>
        <text class="step" x="652" y="640">05 · HARDEN ONCE</text>
        <text class="title" x="652" y="672">Isolated candidate</text>
        <text class="body" x="652" y="692">Original remains unchanged</text>

        <path class="flow" d="M974 656H1052"/>
        <rect class="node" x="1052" y="612" width="290" height="88" rx="10"/>
        <text class="step" x="1076" y="640">06 · MEASURE AFTER</text>
        <text class="body" x="1076" y="668">REA · Craft Anything</text>
        <text class="body" x="1076" y="692">Build · behavior · integrity</text>

        <path class="compare" d="M64 140H42V656H626"/>
        <text class="label" x="52" y="420" transform="rotate(-90 52 420)" text-anchor="middle">SAME BEFORE REFERENCE</text>

        <path class="flow" d="M1342 656H1394"/>
        <path class="decision" d="M1430 612 1470 656 1430 700 1390 656Z"/>
        <text class="title" x="1430" y="652" text-anchor="middle" style="font-size:13px">Gates</text>
        <text class="title" x="1430" y="668" text-anchor="middle" style="font-size:13px">pass?</text>

        <path d="M1430 612V550H1510" fill="none" stroke="#087f68" stroke-width="2.5" marker-end="url(#arrow-green)"/>
        <text class="label-green" x="1460" y="540">YES</text>
        <text class="label-green" x="1492" y="530">ACCEPT</text>
        <path class="loop" d="M1430 700V752H800V700"/>
        <text class="label-coral" x="1030" y="744">NO · REJECTED / PARTIAL · NEW PLAN REQUIRED TO RETRY</text>

        <text class="caption" x="64" y="790">Keep engine results separate. A successful build alone is not proof of protection.</text>
        </g>
      </svg>
    </div>
    <footer><strong>Anti-REA</strong><span>Measure change. Preserve user control. Keep evidence tied to the tested release.</span></footer>
  </main>
</body>
</html>
